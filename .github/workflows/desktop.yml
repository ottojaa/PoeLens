name: Desktop

# Builds the desktop installers. A `desktop-vX.Y.Z` tag also collects them into a draft GitHub Release, which nobody
# sees until it is published by hand.
on:
    push:
        tags: ['desktop-v*']
    pull_request:
        paths:
            - .github/workflows/desktop.yml
            - apps/web/build/**
            - apps/web/electron/**
            - apps/web/package.json
            - apps/web/project.json
            - scripts/smoke-desktop.sh
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: build (${{ matrix.platform }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: mac
                      os: macos-latest
                    - platform: win
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45

        steps:
            # Actions are pinned to the commit of the release named beside each.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - name: Install dependencies
              run: node .yarn/releases/yarn-4.17.1.cjs install --immutable

            # The version in the repository is a placeholder: a release takes its version from the tag.
            - name: Take the version from the tag
              if: github.ref_type == 'tag'
              shell: bash
              working-directory: apps/web
              run: |
                  version=${GITHUB_REF_NAME#desktop-v}
                  if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::The tag must look like desktop-vX.Y.Z: $GITHUB_REF_NAME"
                      exit 1
                  fi
                  npm pkg set version="$version"

            - name: Package
              run: npx nx run @poelens/web:package:${{ matrix.platform }}
              env:
                  # electron-builder skips signing on pull requests to protect certificates. The macOS signature here is
                  # ad-hoc and uses none, and without it the pull request build differs from the released one.
                  CSC_FOR_PULL_REQUEST: true

            - name: Check the macOS apps
              if: matrix.platform == 'mac'
              run: |
                  for app in apps/web/release/{mac,mac-arm64}/PoeLens.app; do
                      test -f "$app/Contents/Resources/app-update.yml"
                      codesign --verify --deep --strict "$app"
                      codesign -dv "$app" 2>&1 | grep 'Signature=adhoc'
                  done

            # The disk image is what people download, so the app inside it is checked as well.
            - name: Check the macOS disk images
              if: matrix.platform == 'mac'
              run: |
                  mount="$RUNNER_TEMP/dmg"
                  for dmg in apps/web/release/*.dmg; do
                      hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
                      codesign --verify --deep --strict "$mount/PoeLens.app"
                      codesign -dv "$mount/PoeLens.app" 2>&1 | grep 'Signature=adhoc'
                      hdiutil detach "$mount"
                      echo "Checked: $dmg"
                  done

            - name: Launch smoke test
              if: matrix.platform == 'mac'
              run: scripts/smoke-desktop.sh apps/web/release/mac-arm64/PoeLens.app/Contents/MacOS/PoeLens

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: poelens-${{ matrix.platform }}
                  if-no-files-found: error
                  path: |
                      apps/web/release/*.blockmap
                      apps/web/release/*.dmg
                      apps/web/release/*.exe
                      apps/web/release/*.zip
                      apps/web/release/latest*.yml

    release:
        name: draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: installers
                  merge-multiple: true

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" installers/* \
                      --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                      --title "PoeLens ${GITHUB_REF_NAME#desktop-v}" --generate-notes
