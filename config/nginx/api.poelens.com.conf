# Nginx config for api.poelens.com: proxies to the backend container on 127.0.0.1:3100.
#
# Port 80 only, so `nginx -t` passes before any certificate exists; certbot adds the 443 block and the redirect.
# See the note on `http2 on;` in poelens.com.conf (nginx 1.25.1 or newer).
#
# Installation:
#   sudo cp api.poelens.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.poelens.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d poelens.com -d www.poelens.com -d api.poelens.com   # one certificate for all three names

upstream poelens_backend {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    server_name api.poelens.com;
    http2 on;

    # The API takes small JSON bodies only.
    client_max_body_size 1m;

    location / {
        proxy_pass http://poelens_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
