# Nginx config for poelens.com (the React SPA) and www.poelens.com (redirects to it).
#
# Serves the static Vite build from /opt/poelens/web, which scripts/deploy.sh refreshes on every deploy.
# Port 80 only, so `nginx -t` passes before any certificate exists; certbot adds the 443 blocks and the HTTP -> HTTPS
# redirects when it runs (it copies these server blocks, including `http2 on;`).
#
# `http2 on;` needs nginx 1.25.1 or newer (check: nginx -v). On an older nginx, delete those lines and, after certbot
# has run, change each `listen 443 ssl;` it wrote into `listen 443 ssl http2;`.
#
# Installation:
#   sudo cp poelens.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/poelens.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d poelens.com -d www.poelens.com -d api.poelens.com   # needs api.poelens.com.conf installed too

# www redirects to the bare domain. The redirect sits in a location so certbot's challenge location can still win.
server {
    listen 80;
    server_name www.poelens.com;
    http2 on;

    location / {
        return 301 https://poelens.com$request_uri;
    }
}

server {
    listen 80;
    server_name poelens.com;
    http2 on;

    root /opt/poelens/web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback: every route is served by index.html (TanStack Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets (Vite adds content hashes)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html, so a deploy shows up on the next load
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
