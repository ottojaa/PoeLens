<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>PoeLens</title>

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Prevent a flash of the wrong theme: paint the theme and mode this browser last showed before React loads.
             The ids below are the themes the API accepts (THEME_IDS in @poelens/shared; theme.test.ts keeps them equal). -->
        <script>
            (function () {
                var THEMES = ['reverie', 'slate', 'graphite'];
                var MODES = ['dark', 'light', 'system'];
                var root = document.documentElement;
                var theme = 'reverie';
                var mode = 'dark';

                try {
                    var storedTheme = localStorage.getItem('poelens-theme');
                    var storedMode = localStorage.getItem('poelens-mode');

                    // Before themes, 'poelens-theme' held the colour mode: 'dark' or 'light'. Keep that choice, once.
                    if (storedMode === null && (storedTheme === 'dark' || storedTheme === 'light')) {
                        storedMode = storedTheme;
                        localStorage.setItem('poelens-mode', storedMode);
                    }

                    if (THEMES.indexOf(storedTheme) !== -1) theme = storedTheme;
                    else if (storedTheme !== null) localStorage.removeItem('poelens-theme');

                    if (MODES.indexOf(storedMode) !== -1) mode = storedMode;
                } catch (error) {
                    // Storage is blocked: the defaults stand.
                }

                var dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark';

                root.setAttribute('data-theme', theme);
                if (dark) root.classList.add('dark');
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
